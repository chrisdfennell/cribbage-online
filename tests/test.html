<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Cribbage tests</title></head>
<body>
<pre id="out">running…</pre>
<script src="../js/cards.js"></script>
<script src="../js/scoring.js"></script>
<script src="../js/ai.js"></script>
<script>
  const { parseCard } = CribCards;
  const { scoreHand, scorePegging } = CribScoring;
  const results = [];
  const H = (s) => s.split(' ').map(parseCard);
  function hand(cards, starter, expected, crib = false, name = '') {
    const got = scoreHand(H(cards), parseCard(starter), crib).total;
    results.push({ name: name || `${cards} | ${starter}${crib ? ' (crib)' : ''}`, ok: got === expected, got, expected });
  }
  function peg(cards, expected, name = '') {
    const got = scorePegging(H(cards)).total;
    results.push({ name: name || `peg ${cards}`, ok: got === expected, got, expected });
  }

  // --- the show (expected values worked out by hand)
  hand('5H 5D 5C JS', '5S', 29, false, 'perfect 29');
  hand('5H 5D 5C 5S', 'KH', 28, false, 'four fives + K = 28');
  hand('4H 5D 6C 6S', '5S', 24, false, '4-5-5-6-6 double double run = 24');
  hand('3H 3D 3C 9S', '9D', 20, false, '3-3-3-9-9 = 12 + 8 = 20');
  hand('7H 7D 8C 8S', '9D', 24, false, '7-7-8-8-9 = 8 + 4 + 12 = 24');
  hand('6C 6D 6H 9S', '9H', 20, false, '6-6-6-9-9 = 12 + 8 = 20');
  hand('AH 3H 7H 9H', 'QS', 4, false, '4-card flush in hand');
  hand('AH 3H 7H 9H', 'QS', 0, true, 'no 4-card flush in crib');
  hand('AH 3H 7H 9H', 'KH', 5, true, '5-card flush in crib');
  hand('2C 4D 6H JS', '8S', 1, false, 'his nobs only');
  hand('2C 4D 6H JS', '8H', 0, false, 'jack not matching starter: no nobs');
  hand('10H JD QC KS', '5H', 12, false, 'run of 4 + four fifteens');
  hand('2C 4D 6H 10S', 'QH', 0, false, 'nineteen hand');
  hand('AC 2D 3H 4S', '5C', 7, false, 'run of 5 + fifteen');
  hand('JC QC KC 9D', 'AH', 3, false, 'run J-Q-K');
  hand('JC QC KC AC', 'AH', 9, false, 'run + 4 flush + pair of aces');
  hand('JC QC KC AC', 'AH', 5, true, 'same in crib: no 4 flush');
  hand('2H 3H 4H 4D', '4S', 17, false, 'triple run 2-3-4-4-4');

  // --- the play
  peg('3H 4D 5C', 3, 'run of 3');
  peg('4H 6D 5C', 5, '4-6-5 = fifteen 2 + run 3');
  peg('5H 5D', 2, 'pair');
  peg('5H 5D 5C', 8, 'pair royal making 15');
  peg('2H 2D 2C 2S', 12, 'double pair royal');
  peg('7H 8D', 2, 'fifteen');
  peg('KH QD AC', 0, 'K-Q-A is not a run');
  peg('3H 2D AC', 3, 'A-2-3 run');
  peg('3H 4D 3C 5S', 5, '3-4-3-5: run 4-3-5 + fifteen');
  peg('10H 10D 6C 5S', 2, 'thirty-one');
  peg('JH QD', 0, 'J and Q are not a pair');
  peg('4H 5D 6C 4S 5H', 3, 'runs broken by repeats, last three still a run');
  peg('6H 7D 8C 5S', 4, 'run of 4 out of order');
  peg('KH 5D', 2, 'K + 5 fifteen');
  peg('9H 9D 9C', 6, 'pair royal');
  peg('9H 3D 9C', 0, 'not a pair (separated)');

  // AI sanity: from 5-5-5-J-x-x it should keep the fives & jack
  const disc = CribAI.chooseDiscard(H('5H 5D 5C JS KD 2C'), 2, false, 'expert');
  const ids = disc.map((c) => c.id).sort().join(',');
  results.push({ name: 'AI keeps 5-5-5-J', ok: ids === '2C,KD', got: ids, expected: '2C,KD' });

  const failed = results.filter((r) => !r.ok);
  document.getElementById('out').textContent = JSON.stringify({ passed: results.length - failed.length, failed });
</script>
</body>
</html>
